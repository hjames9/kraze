name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. Security advisories are published against code that has not
    # changed, so the vulnerability scan has to run on a timer and not only on
    # push, or a new CVE in a pinned dependency goes unnoticed until the next
    # commit.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Built with this job's Go, at the version the Makefile pins: a linter
      # built against an older x/tools can't read the toolchain's export data
      - name: Lint
        run: |
          make lint-install
          make lint

      - name: Build
        run: go build ./...

      # The race detector covers up's parallel installs; it needs cgo, which
      # only the test binaries use (release builds stay CGO_ENABLED=0)
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Per-package coverage is in the test output above
      - name: Coverage
        run: |
          echo "Total coverage: $(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')" >> "$GITHUB_STEP_SUMMARY"
          scripts/coverage-floor.sh coverage.out

      - name: Validate examples
        run: make validate-examples

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Dependency vulnerabilities, filtered to those actually reachable from
      # kraze's own call graph. See scripts/govulncheck.sh for the allowlist.
      - name: govulncheck
        run: make vuln

      # Static analysis of kraze's own code.
      - name: gosec
        run: make sec
