name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. Security advisories are published against code that has not
    # changed, so the vulnerability scan has to run on a timer and not only on
    # push, or a new CVE in a pinned dependency goes unnoticed until the next
    # commit.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Validate examples
        run: make validate-examples

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Dependency vulnerabilities, filtered to those actually reachable from
      # kraze's own call graph. See scripts/govulncheck.sh for the allowlist.
      - name: govulncheck
        run: make vuln

      # Static analysis of kraze's own code.
      - name: gosec
        run: make sec
