# Explicit Images Example
#
# Demonstrates the `images` field, which lets you list local Docker images
# that kraze should load into the kind cluster for a service.
#
# By default kraze auto-detects images by rendering Helm charts and reading
# manifests. The `images` field supplements that detection — useful when
# images are referenced in places auto-detection cannot reach, such as:
#
#   - Operator-managed pods that the chart itself doesn't template
#   - Images referenced only at runtime (e.g. sourced from ConfigMaps)
#   - Charts that can't be rendered offline
#
# The explicit list is merged with auto-detected images and deduplicated,
# so listing an image that auto-detection already finds is harmless.
#
# Usage:
#   kraze up     # Install all services
#   kraze down   # Uninstall all

project: explicit-images

cluster:
  name: explicit-images-cluster

services:
  # Keycloak deployed via Helm. Rendering the chart finds the official
  # keycloak image and the theme init container from keycloak-values.yaml.
  #
  # The theme image is listed explicitly anyway, as it would have to be if
  # the chart couldn't be rendered offline: if a locally built copy exists,
  # it is loaded into the cluster before the Helm install runs.
  keycloak:
    type: helm
    chart: keycloak
    repo: oci://registry-1.docker.io/cloudpirates
    version: 0.21.46
    namespace: auth
    create_namespace: true
    values: ./keycloak-values.yaml
    images:
      - hjames/kora-keycloak-theme:latest   # theme provider init container

  # A manifest-based service where all images are in standard container
  # spec fields — auto-detection handles them without any explicit list.
  # Shown here to demonstrate that `images` is purely additive.
  redis:
    type: manifests
    path: ./redis.yaml
    namespace: data
    create_namespace: true
    # No `images` field needed — auto-detection finds redis:7-alpine
    # from the Deployment manifest automatically.
