# Values for the cloudpirates/keycloak chart (official keycloak/keycloak image).
#
# The theme ships as a Keycloak provider jar in hjames/kora-keycloak-theme,
# whose entrypoint copies it to /providers. The init container below mounts
# the chart's providers volume there, so Keycloak finds the jar in
# /opt/keycloak/providers at startup.

# Single replica is plenty for local development
replicaCount: 1

keycloak:
  adminUser: admin
  adminPassword: admin
  # Runs `kc.sh start-dev` (no TLS or hostname setup needed)
  production: false

# The chart's embedded PostgreSQL (postgres.enabled) is the database.

extraInitContainers:
  - name: theme-provider
    image: hjames/kora-keycloak-theme:latest
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - name: keycloak-providers   # the chart's emptyDir for /opt/keycloak/providers
        mountPath: /providers

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"
